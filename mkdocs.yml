site_name: Vetor PAS
site_description: Análise Preditiva PAS - Inteligência de dados para aprovação.
site_author: Squad Vetor PAS

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - toc.integrate

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html

nav:
  - 🌐 Acessar Sistema (Web): https://vetorpas.streamlit.app
  - 🚀 Landing Page Comercial: http://localhost:3000
  - Home: index.md
  - Arquitetura Geral: architecture.md
  - Requisitos do Sistema: requirements.md
  - Módulos do Sistema:
    - Dashboard (Streamlit): modules/app.md
    - Motor de Inteligência: modules/pas_intelligence.md
    - Extratores de Dados: modules/parsers.md
    - Gerador de PDF: modules/pdf_generator.md
