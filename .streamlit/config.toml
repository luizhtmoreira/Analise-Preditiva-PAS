[theme]
base="light"                 # <--- ESSA É A CHAVE MESTRA. FORÇA O MODO CLARO.
primaryColor="#003366"       # Azul Marinho (Botões e Foco)
backgroundColor="#FFFFFF"    # Fundo Branco Absoluto
secondaryBackgroundColor="#F0F2F6" # Cinza Claro (Sidebar)
textColor="#262730"          # Texto Cinza Escuro
font="sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
runOnSave = true             # Dica: Recarrega o site sozinho quando você salva o código